<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>CHUONG TRINH XEP LOAI HOC LUC</h2>
    <label for="diem">Nhap diem (0-100)</label>
    <input type="number" id="diem">
    <br><br>
    <button onclick="xepLoai()">Xep loai</button>
    <h3 id="ketqua"></h3>

    <script>
        function xepLoai(){
            let diem = document.getElementById("diem").value;
            if(diem === ""){
                document.getElementById("ketqua").innerHTML = "Vui long nhap diem";
                return;
            }
            diem = parseFloat(diem);
            if(diem < 0 || diem > 100){
                document.getElementById("ketqua").innerHTML = "Diem phai nam trong khoang tu 0 den 100";
                return;
            }
            let loai;
            if(diem >= 90){
                loai = "A";
            }else if(diem >= 80){
                loai = "B";
            }else if(diem >= 70){
                loai = "C";
            }else if(diem >= 60){
                loai = "D";
            }else{
                loai = "F";
            }
            document.getElementById("ketqua").innerHTML =
            "Diem: " + diem + " - Xep loai: " + loai;
        }
    </script>
</body>
</html>
