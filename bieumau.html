<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
    <h2>Registration Form</h2>
<body>
    <table>
        <form>
            <tr>
                <td>
                    <label for="user">First name:</label>
                    <input type="text" placeholder="Enter first name">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="user">Last name:</label>
                    <input type="text" placeholder="Enter last name">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="user">Email:</label>
                    <input type="text" placeholder="Enter Email Address">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="user">Password:</label>
                    <input type="text">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="user">Gender:</label><br>
                    <label><input name="role" type="radio">Male</label><br>
                    <label><input name="role" type="radio">Female</label><br>
                    <label><input name="role" type="radio">Other</label> 
                </td>
            </tr>
            <tr>
                <td>
                    <label for="user">Age:</label>
                    <input type="number" id="user" name="age">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="user">Preferences:</label><br>
                    <label><input type="checkbox">Acrylic Painting</label><br>
                    <label><input type="checkbox">Oil Painting</label><br>
                    <label><input type="checkbox">Water Color Painting</label> 
                </td>
            </tr>
            <tr>
                <td>
                    <label for="user">Select Occupation</label>
                    <select>
                        <option>Student</option>
                        <option>Teacher</option>
                        <option>Other</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="user">Bio</label>
                    <textarea id="user" name="user" rows="4" cols="30" placeholder="Share few lines about yourself..."></textarea>
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    <input type="reset" value="RESET">
                    <input type="submit" value="SUBMIT">
                </td>
            </tr>
        </form>
    </table>

    
</body>
</html>
