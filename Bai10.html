<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>CHUONG TRINH MAY TINH DON GIAN</h2>
    <label for="so1">Nhap so thu nhat</label>
    <input type="number" id="so1">
    <br><br>
    <label for="so2">Nhap so thu hai</label>
    <input type="number" id="so2">
    <br><br>
    <button onclick="tinh('+')">Cong</button>
    <button onclick="tinh('-')">Tru</button>
    <button onclick="tinh('*')">Nhan</button>
    <button onclick="tinh('/')">Chia</button>
    <h3 id="ketqua"></h3>

    <script>
        function tinh(phepTinh){
            let so1 = document.getElementById("so1").value;
            let so2 = document.getElementById("so2").value;
            if(so1 === "" || so2 === ""){
                document.getElementById("ketqua").innerHTML = "Vui long nhap du hai so";
                return;
            }
            so1 = parseFloat(so1);
            so2 = parseFloat(so2);
            let kq;
            if(phepTinh === "+"){
                kq = so1 + so2;
            }else if(phepTinh === "-"){
                kq = so1 - so2;
            }else if(phepTinh === "*"){
                kq = so1 * so2;
            }else{
                if(so2 === 0){
                    document.getElementById("ketqua").innerHTML = "Khong the chia cho 0";
                    return;
                }
                kq = so1 / so2;
            }
            document.getElementById("ketqua").innerHTML =
            so1 + " " + phepTinh + " " + so2 + " = " + kq;
        }
    </script>
</body>
</html>
