<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài tập 1 - findMax</title>
</head>
<body>
    <h2>Kết quả Bài tập 1:</h2>
    <div id="result"></div>

    <script>
        function findMax(arr) {
            let max = arr[0];
            for (let i = 1; i < arr.length; i++) {
                if (arr[i] > max) {
                    max = arr[i];
                }
            }
            return max;
        }

        let res = findMax([1, 3, 5, 7, 9]); 
        console.log(res);
        document.getElementById("result").innerHTML = "findMax([1, 3, 5, 7, 9]) = " + res;
    </script>
</body>
</html>
