<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài tập 10 - sumOfSquares</title>
</head>
<body>
    <h2>Kết quả Bài tập 10:</h2>
    <div id="result"></div>

    <script>
        function sumOfSquares(arr) {
            let sum = 0;
            for (let i = 0; i < arr.length; i++) {
                sum += arr[i] * arr[i];
            }
            return sum;
        }

        let res = sumOfSquares([1, 2, 3]); 
        console.log(res);
        document.getElementById("result").innerHTML = "sumOfSquares([1, 2, 3]) = " + res;
    </script>
</body>
</html>
