<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài tập 8 - countGreaterThan</title>
</head>
<body>
    <h2>Kết quả Bài tập 8:</h2>
    <div id="result"></div>

    <script>
        function countGreaterThan(arr, value) {
            let count = 0;
            for (let i = 0; i < arr.length; i++) {
                if (arr[i] > value) {
                    count++;
                }
            }
            return count;
        }

        let res = countGreaterThan([1, 5, 7, 2, 3], 3); 
        console.log(res);
        document.getElementById("result").innerHTML = "countGreaterThan([1, 5, 7, 2, 3], 3) = " + res;
    </script>
</body>
</html>
