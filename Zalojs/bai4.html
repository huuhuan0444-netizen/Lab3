<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài tập 4 - countPositiveNumbers</title>
</head>
<body>
    <h2>Kết quả Bài tập 4:</h2>
    <div id="result"></div>

    <script>
        function countPositiveNumbers(arr) {
            let count = 0;
            for (let i = 0; i < arr.length; i++) {
                if (arr[i] > 0) {
                    count++;
                }
            }
            return count;
        }

        let res = countPositiveNumbers([-1, 2, 3, -4, 5]); 
        console.log(res);
        document.getElementById("result").innerHTML = "countPositiveNumbers([-1, 2, 3, -4, 5]) = " + res;
    </script>
</body>
</html>
