<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài tập 15 - removeDuplicates</title>
</head>
<body>
    <h2>Kết quả Bài tập 15:</h2>
    <div id="result"></div>

    <script>
        function removeDuplicates(arr) {
            let result = [];
            for (let i = 0; i < arr.length; i++) {
                let isDuplicate = false;
                for (let j = 0; j < result.length; j++) {
                    if (arr[i] === result[j]) {
                        isDuplicate = true;
                        break;
                    }
                }
                if (!isDuplicate) {
                    result.push(arr[i]);
                }
            }
            return result;
        }

        let res = removeDuplicates([1, 2, 2, 3, 4, 4, 5]); 
        console.log(res);
        document.getElementById("result").innerHTML = "removeDuplicates([1, 2, 2, 3, 4, 4, 5]) = " + JSON.stringify(res);
    </script>
</body>
</html>
