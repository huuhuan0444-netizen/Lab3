<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài tập 2 - sumOddNumbers</title>
</head>
<body>
    <h2>Kết quả Bài tập 2:</h2>
    <div id="result"></div>

    <script>
        function sumOddNumbers(arr) {
            let sum = 0;
            for (let i = 0; i < arr.length; i++) {
                if (arr[i] % 2 !== 0) {
                    sum += arr[i];
                }
            }
            return sum;
        }

        let res = sumOddNumbers([1, 2, 3, 4, 5]); 
        console.log(res);
        document.getElementById("result").innerHTML = "sumOddNumbers([1, 2, 3, 4, 5]) = " + res;
    </script>
</body>
</html>
