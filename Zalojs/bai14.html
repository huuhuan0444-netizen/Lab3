<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài tập 14 - findMissingNumber</title>
</head>
<body>
    <h2>Kết quả Bài tập 14:</h2>
    <div id="result"></div>

    <script>
        function findMissingNumber(arr, n) {
            let expectedSum = (n * (n + 1)) / 2;
            let actualSum = 0;
            for (let i = 0; i < arr.length; i++) {
                actualSum += arr[i];
            }
            return expectedSum - actualSum;
        }

        let res = findMissingNumber([1, 2, 4, 5, 6], 6); 
        console.log(res);
        document.getElementById("result").innerHTML = "findMissingNumber([1, 2, 4, 5, 6], 6) = " + res;
    </script>
</body>
</html>
