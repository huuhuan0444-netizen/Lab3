<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>CHUONG TRINH CHUYEN DOI NHIET DO</h2>
    <label for="celsius">Nhap nhiet do theo do C</label>
    <input type="number" id="celsius">
    <br><br>
    <button onclick="chuyenDoi()">Chuyen doi</button>
    <h3 id="ketqua"></h3>

    <script>
        function chuyenDoi(){
            let c = document.getElementById("celsius").value;
            if(c === ""){
                document.getElementById("ketqua").innerHTML = "Vui long nhap nhiet do";
                return;
            }
            c = parseFloat(c);
            let f = (9 / 5) * c + 32;
            document.getElementById("ketqua").innerHTML =
            c + " do C = " + f.toFixed(2) + " do F";
        }
    </script>
</body>
</html>
